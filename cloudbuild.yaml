steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/amazon-product-search:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/amazon-product-search:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'amazon-product-search'
    - '--image'
    - 'gcr.io/$PROJECT_ID/amazon-product-search:$COMMIT_SHA'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--memory'
    - '1Gi'
    - '--cpu'
    - '1'
    - '--max-instances'
    - '10'
    - '--set-env-vars'
    - 'GENIUSLINK_API_KEY=${_GENIUSLINK_API_KEY},GENIUSLINK_API_SECRET=${_GENIUSLINK_API_SECRET},AMAZON_ACCESS_KEY=${_AMAZON_ACCESS_KEY},AMAZON_SECRET_KEY=${_AMAZON_SECRET_KEY}'

images:
  - gcr.io/$PROJECT_ID/amazon-product-search:$COMMIT_SHA